name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      # Runs before the toolchain work: it needs no compiler and catches a
      # screenshot rename that left a doc pointing at a file that no longer exists.
      - name: Check doc image references
        run: bash scripts/check-doc-links.sh
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      # Capture tests self-skip via `.enabled(if: CGPreflightScreenCaptureAccess())`
      # — headless runners have no Screen Recording grant. (A future release job
      # that runs scripts/bundle.sh will sign ad-hoc, since the dev signing
      # keychain from scripts/setup-signing.sh only exists on the dev Mac.)
      - name: Test
        run: swift test
