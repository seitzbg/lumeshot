name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      # Signing is gated on the secrets existing, so a fork or a repo without
      # them still produces a working (ad-hoc, unnotarized) dmg rather than a
      # failed release. `secrets` is not allowed in a job-level `if`, so the
      # decision is materialized here once and reused.
      #
      # All six are required, not just the two big ones: a partial setup (say a
      # .p12 with no password) would otherwise switch signing on and then fail
      # the release outright, instead of falling back to the unsigned path this
      # gate exists to provide.
      SIGNING_ENABLED: >-
        ${{ secrets.DEVELOPER_ID_P12 != ''
            && secrets.DEVELOPER_ID_P12_PASSWORD != ''
            && secrets.ASC_KEY_P8 != ''
            && secrets.ASC_KEY_ID != ''
            && secrets.ASC_ISSUER_ID != ''
            && secrets.TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      # A v* tag can point at a commit the push/PR workflow never saw, so the
      # release job re-runs the full suite rather than trusting the tag.
      - name: Test
        run: swift test

      - name: Build (release)
        run: swift build -c release

      # The certificate goes into a throwaway keychain, never the runner's
      # login keychain: it is unlocked non-interactively, its password is
      # ephemeral, and the whole thing is deleted in a step that runs even if
      # the job fails.
      - name: Import Developer ID certificate
        if: env.SIGNING_ENABLED == 'true'
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -hex 32)"
          P12="$RUNNER_TEMP/developer-id.p12"

          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"          # no auto-lock during the build
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign prompts for keychain access and hangs the runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$P12"

          # Resolve by SHA-1 hash rather than name: unambiguous even if the
          # runner image ever ships a same-named certificate.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/[0-9A-F]{40}/{print $2; exit}')"
          [ -n "$IDENTITY" ] || { echo "::error::no code-signing identity found in the imported keychain"; exit 1; }
          echo "Imported identity $IDENTITY"
          echo "CODESIGN_ID=$IDENTITY"        >> "$GITHUB_ENV"
          echo "CODESIGN_KEYCHAIN=$KEYCHAIN"  >> "$GITHUB_ENV"
          echo "DEVELOPER_ID_SIGNING=1"       >> "$GITHUB_ENV"

      - name: Bundle app
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/bundle.sh

      # Catches the wrong certificate being imported — a valid signature from
      # some other team would otherwise sail through and only fail later, at
      # notarization, with a much less obvious error.
      - name: Verify the signing identity
        if: env.SIGNING_ENABLED == 'true'
        env:
          EXPECTED_TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -euo pipefail
          ACTUAL="$(codesign -d --verbose=2 dist/Lumeshot.app 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          if [ "$ACTUAL" != "$EXPECTED_TEAM_ID" ]; then
            echo "::error::app signed by team '$ACTUAL' but TEAM_ID secret says '$EXPECTED_TEAM_ID'"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 dist/Lumeshot.app
          echo "Signed by team $ACTUAL"

      - name: Create dmg
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/dmg.sh

      - name: Notarize and staple
        if: env.SIGNING_ENABLED == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          export ASC_KEY_PATH="$RUNNER_TEMP/asc-key.p8"
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$ASC_KEY_PATH"
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          scripts/notarize.sh dist/Lumeshot-"${GITHUB_REF_NAME#v}".dmg

      - name: Warn when publishing unsigned
        if: env.SIGNING_ENABLED != 'true'
        run: |
          echo "::warning::Signing secrets are absent — publishing an ad-hoc, unnotarized dmg. \
          Users will need right-click → Open. See docs/RELEASING.md."

      # Checksums are taken after notarization: stapling rewrites the dmg, so
      # sums computed earlier would not match what people download.
      - name: Checksum the dmg
        working-directory: dist          # so the sums file names the dmg, not "dist/<dmg>"
        run: shasum -a 256 *.dmg > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.dmg dist/SHA256SUMS.txt --title "${GITHUB_REF_NAME}" --generate-notes

      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
