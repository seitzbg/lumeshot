name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      # Signing is gated on the secrets existing, so a fork or a repo without
      # them still produces a working (ad-hoc, unnotarized) dmg rather than a
      # failed release. `secrets` is not allowed in a job-level `if`, so the
      # decision is materialized here once and reused.
      #
      # All six are required, not just the two big ones: a partial setup (say a
      # .p12 with no password) would otherwise switch signing on and then fail
      # the release outright, instead of falling back to the unsigned path this
      # gate exists to provide.
      SIGNING_ENABLED: >-
        ${{ secrets.DEVELOPER_ID_P12 != ''
            && secrets.DEVELOPER_ID_P12_PASSWORD != ''
            && secrets.ASC_KEY_P8 != ''
            && secrets.ASC_KEY_ID != ''
            && secrets.ASC_ISSUER_ID != ''
            && secrets.TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      # A v* tag can point at a commit the push/PR workflow never saw, so the
      # release job re-runs the full suite rather than trusting the tag.
      - name: Check release notes
        run: test -s "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Test
        run: swift test

      - name: Build (release)
        run: swift build -c release

      # The certificate goes into a throwaway keychain, never the runner's
      # login keychain: it is unlocked non-interactively, its password is
      # ephemeral, and the whole thing is deleted in a step that runs even if
      # the job fails.
      - name: Import Developer ID certificate
        if: env.SIGNING_ENABLED == 'true'
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -hex 32)"
          P12="$RUNNER_TEMP/developer-id.p12"

          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"          # no auto-lock during the build
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign prompts for keychain access and hangs the runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$P12"

          # Resolve by SHA-1 hash rather than name: unambiguous even if the
          # runner image ever ships a same-named certificate.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/[0-9A-F]{40}/{print $2; exit}')"
          [ -n "$IDENTITY" ] || { echo "::error::no code-signing identity found in the imported keychain"; exit 1; }
          echo "Imported identity $IDENTITY"
          echo "CODESIGN_ID=$IDENTITY"        >> "$GITHUB_ENV"
          echo "CODESIGN_KEYCHAIN=$KEYCHAIN"  >> "$GITHUB_ENV"
          echo "DEVELOPER_ID_SIGNING=1"       >> "$GITHUB_ENV"

      - name: Bundle app
        run: VERSION="${GITHUB_REF_NAME#v}" RELEASE_CHANNEL=release scripts/bundle.sh

      # Catches the wrong certificate being imported — a valid signature from
      # some other team would otherwise sail through and only fail later, at
      # notarization, with a much less obvious error.
      - name: Verify the signing identity
        if: env.SIGNING_ENABLED == 'true'
        env:
          EXPECTED_TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -euo pipefail
          ACTUAL="$(codesign -d --verbose=2 dist/Lumeshot.app 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          if [ "$ACTUAL" != "$EXPECTED_TEAM_ID" ]; then
            echo "::error::app signed by team '$ACTUAL' but TEAM_ID secret says '$EXPECTED_TEAM_ID'"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 dist/Lumeshot.app
          echo "Signed by team $ACTUAL"

      - name: Create dmg
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/dmg.sh

      - name: Notarize and staple
        if: env.SIGNING_ENABLED == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          export ASC_KEY_PATH="$RUNNER_TEMP/asc-key.p8"
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$ASC_KEY_PATH"
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          scripts/notarize.sh dist/Lumeshot-"${GITHUB_REF_NAME#v}".dmg

      - name: Warn when publishing unsigned
        if: env.SIGNING_ENABLED != 'true'
        run: |
          echo "::warning::Signing secrets are absent — publishing an ad-hoc, unnotarized dmg. \
          Users will need right-click → Open. See docs/RELEASING.md."

      # Checksums are taken after notarization: stapling rewrites the dmg, so
      # sums computed earlier would not match what people download.
      - name: Checksum the dmg
        working-directory: dist          # so the sums file names the dmg, not "dist/<dmg>"
        run: shasum -a 256 *.dmg > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*.dmg dist/SHA256SUMS.txt
          --title "${GITHUB_REF_NAME}" --notes-file "docs/releases/${GITHUB_REF_NAME}.md"

      # The feed lives on gh-pages; the dmg stays on the release CDN, so only
      # appcast.xml is pushed. Gated on SIGNING_ENABLED: an unsigned build must
      # never be advertised to installed copies, which would offer users an
      # update Gatekeeper then refuses.
      - name: Update the Sparkle appcast
        if: env.SIGNING_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY is not set; installed copies would never see this release"
            exit 1
          fi
          # Pinned to the version in Package.resolved, so the tool that signs the
          # feed matches the framework that verifies it.
          SPARKLE_VERSION=2.9.6
          curl -fsSL -o /tmp/sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p /tmp/sparkle && tar -xf /tmp/sparkle.tar.xz -C /tmp/sparkle

          # The checkout has persist-credentials: false, so clone the feed branch
          # with an explicit token rather than re-arming the main working tree.
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/pages
          mkdir -p /tmp/appcast
          cp /tmp/pages/appcast.xml /tmp/appcast/
          cp dist/*.dmg /tmp/appcast/
          # generate_appcast picks up release notes from a file named after the
          # archive, so the published notes become the update's description.
          #
          # Note on signatures: generate_appcast omits sparkle:edSignature for a
          # Developer ID signed and notarized dmg, because Sparkle validates those
          # through Apple code signing instead. Verified by comparing against an
          # ad-hoc signed build, which does get a signature. The key is still
          # required — it signs the feed itself.
          DMG_BASE="$(basename dist/*.dmg .dmg)"
          cp "docs/releases/${GITHUB_REF_NAME}.md" "/tmp/appcast/${DMG_BASE}.md"

          # --embed-release-notes puts the notes inline as CDATA. Without it the feed
          # points at a sibling .md file, and only appcast.xml is published, so the
          # notes would 404 in the update dialog.
          printf '%s' "$SPARKLE_PRIVATE_KEY" | /tmp/sparkle/bin/generate_appcast \
            --ed-key-file - \
            --embed-release-notes \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}" \
            /tmp/appcast

          cp /tmp/appcast/appcast.xml /tmp/pages/appcast.xml
          cd /tmp/pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          if git diff --cached --quiet; then
            echo "::error::appcast.xml did not change; the release would be invisible to installed copies"
            exit 1
          fi
          git commit -m "Add ${GITHUB_REF_NAME} to the appcast"
          git push

      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
